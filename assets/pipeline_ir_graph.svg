<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16; font-family:'Outfit', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <rect x="30" y="25" width="1140" height="60" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="60" y="62" fill="#ffffff" font-size="20" font-weight="700">SentinelEye — CraftifAI PipeGen v0.5.1 Pipeline IR Graph</text>
  <rect x="900" y="42" width="240" height="28" rx="14" fill="#0284c7" opacity="0.2" stroke="#38bdf8" />
  <text x="925" y="61" fill="#38bdf8" font-size="12" font-weight="600">INT8 TensorRT Compiled (Active)</text>

  <!-- Stage Group Boxes -->
  <!-- Stage 1 & 2: Ingestion & Preprocess -->
  <g transform="translate(60, 120)">
    <rect width="200" height="480" rx="10" fill="#0f172a" stroke="rgba(56,189,248,0.2)" stroke-dasharray="4,4"/>
    <text x="20" y="35" fill="#38bdf8" font-size="12" font-weight="700">STAGE 1: INPUT STREAM</text>

    <!-- Node 1: Video Source -->
    <rect x="20" y="70" width="160" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="105" fill="#ffffff" font-size="13" font-weight="600">NvMultiStreamSrc</text>
    <text x="35" y="125" fill="#94a3b8" font-size="11">RTSP / USB / File</text>
    <text x="35" y="142" fill="#06b6d4" font-size="10">1920x1080 @ 30fps</text>

    <!-- Node 2: StreamMux -->
    <rect x="20" y="240" width="160" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="275" fill="#ffffff" font-size="13" font-weight="600">NvStreamMux</text>
    <text x="35" y="295" fill="#94a3b8" font-size="11">Batched Preprocessor</text>
    <text x="35" y="312" fill="#06b6d4" font-size="10">NV12 -> RGBA 720p</text>
  </g>

  <!-- Stage 3: TensorRT Core Perception Engines -->
  <g transform="translate(320, 120)">
    <rect width="320" height="480" rx="10" fill="#0f172a" stroke="rgba(16,185,129,0.2)" stroke-dasharray="4,4"/>
    <text x="20" y="35" fill="#10b981" font-size="12" font-weight="700">STAGE 2 &amp; 3: TENSORRT ENGINES</text>

    <!-- Node 3: Primary Detector -->
    <rect x="20" y="70" width="280" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="35" y="102" fill="#ffffff" font-size="14" font-weight="700">PGIE: YOLOv8x Detector</text>
    <text x="35" y="124" fill="#94a3b8" font-size="11">TensorRT INT8 Calibrated (EntropyV2)</text>
    <text x="35" y="142" fill="#10b981" font-size="11" font-weight="600">Latency: 7.1 ms | Classes: Person, Forklift</text>

    <!-- Node 4: NvDCF Tracker -->
    <rect x="20" y="210" width="280" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="242" fill="#ffffff" font-size="13" font-weight="600">NvDCF Multi-Object Tracker</text>
    <text x="35" y="262" fill="#94a3b8" font-size="11">Trajectory &amp; Persistent Worker ID</text>

    <!-- Node 5: Secondary PPE Classifier -->
    <rect x="20" y="330" width="280" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="35" y="362" fill="#ffffff" font-size="13" font-weight="600">SGIE: PPE Classifier (ResNet50)</text>
    <text x="35" y="382" fill="#94a3b8" font-size="11">TensorRT FP16 (Operating on Person BBox)</text>
    <text x="35" y="402" fill="#fbbf24" font-size="10">Helmet, High-Vis Vest, Safety Goggles</text>
  </g>

  <!-- Stage 4: Spatial Analytics & Geofencing -->
  <g transform="translate(700, 120)">
    <rect width="220" height="480" rx="10" fill="#0f172a" stroke="rgba(245,158,11,0.2)" stroke-dasharray="4,4"/>
    <text x="20" y="35" fill="#f59e0b" font-size="12" font-weight="700">STAGE 4: SPATIAL ANALYTICS</text>

    <!-- Node 6: Spatial Geofence Polygon Engine -->
    <rect x="20" y="140" width="180" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="35" y="172" fill="#ffffff" font-size="13" font-weight="700">NvDsAnalytics</text>
    <text x="35" y="194" fill="#94a3b8" font-size="11">Ray-Casting Polygon</text>
    <text x="35" y="214" fill="#f43f5e" font-size="11" font-weight="600">Forklift Exclusion Bay</text>
    <text x="35" y="232" fill="#f43f5e" font-size="11" font-weight="600">Overhead Crane Zone</text>
  </g>

  <!-- Stage 5: Actionable Outputs -->
  <g transform="translate(970, 120)">
    <rect width="180" height="480" rx="10" fill="#0f172a" stroke="rgba(244,63,94,0.2)" stroke-dasharray="4,4"/>
    <text x="15" y="35" fill="#f43f5e" font-size="12" font-weight="700">STAGE 5: ACTIONABLE SINK</text>

    <!-- Node 7: MQTT Broker -->
    <rect x="15" y="70" width="150" height="90" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="25" y="105" fill="#ffffff" font-size="13" font-weight="600">MQTT Broker</text>
    <text x="25" y="125" fill="#94a3b8" font-size="11">Real-Time Alerts</text>
    <text x="25" y="142" fill="#38bdf8" font-size="10">Topic: /incident_alerts</text>

    <!-- Node 8: JSON Incident Log -->
    <rect x="15" y="210" width="150" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="25" y="245" fill="#ffffff" font-size="13" font-weight="600">JSON Audit Log</text>
    <text x="25" y="265" fill="#94a3b8" font-size="11">RFC7946 Audit</text>
    <text x="25" y="282" fill="#10b981" font-size="10">Tamper-evident log</text>

    <!-- Node 9: Live OSD Dashboard -->
    <rect x="15" y="350" width="150" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="25" y="385" fill="#ffffff" font-size="13" font-weight="600">NvOSD Stream</text>
    <text x="25" y="405" fill="#94a3b8" font-size="11">Interactive HUD</text>
    <text x="25" y="422" fill="#c084fc" font-size="10">Web Operations</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <!-- StreamSrc -> Mux -->
    <line x1="160" y1="205" x2="160" y2="355" marker-end="url(#arrow)" />
    <!-- Mux -> PGIE -->
    <path d="M 240 405 L 290 405 L 290 235 L 340 235" />
    <!-- PGIE -> Tracker -->
    <line x1="480" y1="290" x2="480" y2="330" />
    <!-- Tracker -> SGIE -->
    <line x1="480" y1="410" x2="480" y2="450" />
    <!-- SGIE & Tracker -> Geofencing -->
    <path d="M 620 235 L 670 235 L 670 320 L 720 320" />
    <path d="M 620 500 L 670 500 L 670 320 L 720 320" />
    <!-- Geofencing -> Sinks -->
    <path d="M 920 320 L 950 320 L 950 205 L 985 205" />
    <path d="M 920 320 L 950 320 L 950 345 L 985 345" />
    <path d="M 920 320 L 950 320 L 950 485 L 985 485" />
  </g>
</svg>
