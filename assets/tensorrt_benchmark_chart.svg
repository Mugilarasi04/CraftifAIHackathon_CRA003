<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" style="background:#090d16; font-family:'Outfit', -apple-system, sans-serif;">
  <!-- Header -->
  <rect x="30" y="25" width="1040" height="60" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="60" y="62" fill="#ffffff" font-size="20" font-weight="700">TensorRT Optimization Report — CraftifAI PipeGen Stage 4</text>
  <text x="740" y="61" fill="#10b981" font-size="13" font-weight="600">Platform: NVIDIA Jetson Orin / RTX Ada</text>

  <!-- Metric 1: Throughput (FPS) -->
  <g transform="translate(60, 120)">
    <rect width="300" height="400" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
    <text x="25" y="40" fill="#38bdf8" font-size="14" font-weight="700">THROUGHPUT (FPS)</text>
    <text x="25" y="60" fill="#94a3b8" font-size="11">Higher is better</text>

    <!-- Bars -->
    <!-- FP32 -->
    <rect x="40" y="270" width="60" height="100" rx="6" fill="#475569" />
    <text x="70" y="260" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">38 FPS</text>
    <text x="70" y="390" fill="#64748b" font-size="11" text-anchor="middle">FP32</text>

    <!-- FP16 -->
    <rect x="120" y="150" width="60" height="220" rx="6" fill="#0284c7" />
    <text x="150" y="140" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">84 FPS</text>
    <text x="150" y="390" fill="#38bdf8" font-size="11" text-anchor="middle">FP16</text>

    <!-- INT8 -->
    <rect x="200" y="50" width="60" height="320" rx="6" fill="#10b981" />
    <text x="230" y="40" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">141 FPS</text>
    <text x="230" y="390" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">INT8 (3.7x)</text>
  </g>

  <!-- Metric 2: Latency (ms) -->
  <g transform="translate(400, 120)">
    <rect width="300" height="400" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
    <text x="25" y="40" fill="#f59e0b" font-size="14" font-weight="700">INFERENCE LATENCY (ms)</text>
    <text x="25" y="60" fill="#94a3b8" font-size="11">Lower is better (sub-10ms real-time)</text>

    <!-- Bars -->
    <!-- FP32 -->
    <rect x="40" y="90" width="60" height="280" rx="6" fill="#ef4444" />
    <text x="70" y="80" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">26.5 ms</text>
    <text x="70" y="390" fill="#64748b" font-size="11" text-anchor="middle">FP32</text>

    <!-- FP16 -->
    <rect x="120" y="240" width="60" height="130" rx="6" fill="#f59e0b" />
    <text x="150" y="230" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">11.9 ms</text>
    <text x="150" y="390" fill="#fbbf24" font-size="11" text-anchor="middle">FP16</text>

    <!-- INT8 -->
    <rect x="200" y="300" width="60" height="70" rx="6" fill="#10b981" />
    <text x="230" y="290" fill="#10b981" font-size="13" font-weight="800" text-anchor="middle">7.1 ms</text>
    <text x="230" y="390" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">INT8 (-73%)</text>
  </g>

  <!-- Metric 3: Power Consumption (Watts) -->
  <g transform="translate(740, 120)">
    <rect width="300" height="400" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
    <text x="25" y="40" fill="#a855f7" font-size="14" font-weight="700">POWER CONSUMPTION (Watts)</text>
    <text x="25" y="60" fill="#94a3b8" font-size="11">Edge efficiency &amp; thermal footprint</text>

    <!-- Bars -->
    <!-- FP32 -->
    <rect x="40" y="110" width="60" height="260" rx="6" fill="#64748b" />
    <text x="70" y="100" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">44.2 W</text>
    <text x="70" y="390" fill="#64748b" font-size="11" text-anchor="middle">FP32</text>

    <!-- FP16 -->
    <rect x="120" y="195" width="60" height="175" rx="6" fill="#818cf8" />
    <text x="150" y="185" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">29.8 W</text>
    <text x="150" y="390" fill="#818cf8" font-size="11" text-anchor="middle">FP16</text>

    <!-- INT8 -->
    <rect x="200" y="260" width="60" height="110" rx="6" fill="#06b6d4" />
    <text x="230" y="250" fill="#22d3ee" font-size="13" font-weight="800" text-anchor="middle">20.1 W</text>
    <text x="230" y="390" fill="#06b6d4" font-size="11" font-weight="700" text-anchor="middle">INT8 (-55%)</text>
  </g>
</svg>
